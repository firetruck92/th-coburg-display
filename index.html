<style>
/* Layout: Kiosk-Bühne 1080x1920 (Hochformat, ET4363L). Links 6 große Tabs, rechts das aktive Fenster.
   Die Bühne wird per JS auf jede Fenstergröße skaliert; auf dem Display selbst gilt Maßstab 1:1. */
:root{
  --red:#e2231a;
  --orange:#ff6a00;
  --grad:linear-gradient(100deg,#e2231a 0%,#ff6a00 100%);
  --ink:#242220;
  --muted:#686260;
  --line:#e6e1de;
  --soft:#f6f3f1;
  --card:#ffffff;
  --ground:linear-gradient(180deg,#c9c9c9 0%,#e7e7e7 100%);
  --green:#2c7a31;
  --green-bg:#e5f2e6;
  --font:'Roboto','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1a19;color:var(--ink);font-family:var(--font)}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
#vp{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--ground)}

/* Kopfzeile */
header{height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.brand{display:flex;align-items:center;min-width:0}
#logo{display:block;height:84px;width:auto}
.wordmark{display:flex;flex-direction:column;line-height:1;font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.wordmark span{font-weight:400}
.wordmark b{font-weight:900}
.hright{display:flex;align-items:center;gap:30px}
.lang{display:flex;gap:4px;padding:4px;border:3px solid rgba(255,255,255,.92);border-radius:44px}
.lang button{min-width:84px;height:68px;border-radius:34px;font-size:30px;font-weight:700;color:#fff;transition:background .15s}
.lang button:active{transform:scale(.95)}
.lang button.on{background:#fff;color:var(--red)}
.clock{text-align:right;line-height:1.05}
.clock .t{font-size:62px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{font-size:25px;font-weight:400;opacity:.95;margin-top:4px;white-space:nowrap}

/* Hauptbereich */
main{flex:1;min-height:0;display:flex;gap:24px;padding:28px 28px 12px}
nav{width:320px;flex:none;display:flex;flex-direction:column;gap:20px}
.tab{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:22px 24px;border-radius:28px;background:var(--card);color:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .12s ease,background .2s}
.tab svg.ic{width:92px;height:92px}
.tab .lb{font-size:28px;line-height:1.12;font-weight:700;text-transform:uppercase;letter-spacing:.01em;max-width:232px}
.tab .ar{position:absolute;right:22px;bottom:24px;width:34px;height:34px;color:#6d625d}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 12px 26px rgba(226,35,26,.35)}
.tab[aria-selected="true"] .ar{color:#fff}

/* Aktives Fenster */
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);border-radius:32px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.phead{min-height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;gap:22px;padding:16px 36px}
.phead svg{width:68px;height:68px;flex:none}
.phead h1{margin:0;font-size:46px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.phead p{margin:8px 0 0;font-size:26px;line-height:1.15;opacity:.95}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:28px 32px 32px;touch-action:pan-y;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{width:14px}
.pbody::-webkit-scrollbar-thumb{background:#c9c3bf;border-radius:8px}
.pbody::-webkit-scrollbar-track{background:transparent}
.anim{animation:in .26s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Auswahl-Chips */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.chip{min-height:88px;min-width:120px;padding:0 26px;border-radius:44px;border:3px solid var(--line);background:#fff;font-size:29px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--grad);background-origin:border-box;border-color:transparent;color:#fff;font-weight:700}
.chip.day{flex:1;min-width:0;min-height:108px;border-radius:26px;flex-direction:column;gap:2px;padding:0 8px}
.chip.day b{font-size:32px;font-weight:700;text-transform:uppercase}
.chip.day span{font-size:24px;opacity:.85}
.chip.per{flex:1;min-width:0}

/* Zeilen */
.row{display:flex;gap:26px;padding:22px 18px;border-bottom:2px solid var(--line);border-radius:22px}
.row:last-child{border-bottom:0}
.row.now{background:#fff1e6;border-bottom-color:transparent}
.row.done{opacity:.45}
.tm{width:124px;flex:none}
.tm b{display:block;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tm span{display:block;margin-top:8px;font-size:27px;color:var(--muted);font-variant-numeric:tabular-nums}
.info{min-width:0;flex:1}
.info h3{margin:0;font-size:35px;line-height:1.15;font-weight:700}
.info p{margin:8px 0 0;font-size:27px;line-height:1.3;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;font-size:23px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--grad);color:#fff;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:19px;font-size:23px;font-weight:500;border:2px solid var(--line);color:var(--muted);margin:10px 8px 0 0}
.tag.v{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:700}

/* Events / Termine */
.badge{width:116px;height:116px;flex:none;border-radius:26px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge b{font-size:54px;font-weight:900}
.badge span{font-size:25px;font-weight:700;text-transform:uppercase;margin-top:6px;letter-spacing:.04em}
.badge.alt{background:var(--soft);color:var(--ink)}
.when{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;margin-bottom:10px;font-size:23px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.row.compact{gap:22px}
.row.compact h3{font-size:32px}
.row.compact .badge{width:104px;height:104px}
.row.compact .badge b{font-size:48px}
.when.hot{background:#ffe9d8;color:#c4400a}
.when.today{background:var(--grad);color:#fff}

/* Mensa */
.dish{display:flex;gap:20px;align-items:center;padding:24px 22px;margin-bottom:16px;border-radius:26px;background:var(--soft)}
.dish .cat{font-size:23px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin-bottom:6px}
.dish.big{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.dish .mi{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e6e1de}
.dish .bd{padding:18px 22px 22px}
.dish .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:6px}
.dish .top .cat{margin:4px 0 0}
.dish .info{flex:1;min-width:0}
.dish h3{overflow-wrap:anywhere;hyphens:auto;margin:0;font-size:35px;line-height:1.15;font-weight:700}
.price{flex:none;text-align:right;font-size:44px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
.price small{display:block;margin-top:8px;font-size:21px;font-weight:500;color:var(--muted)}

/* Profs */
.prof{display:flex;gap:22px;padding:20px 24px;margin-bottom:14px;border-radius:26px;background:var(--soft)}
.av{width:96px;height:96px;flex:none;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700}
.prof h3{margin:0;font-size:35px;font-weight:700;line-height:1.15}
.prof .f{font-size:27px;color:var(--muted);margin-top:4px}
.prof .f b{color:var(--red);font-weight:700}
.prof p{margin:3px 0 0;font-size:27px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
.prof p b{color:var(--ink);font-weight:500}

/* Leaderboard */
.podium{display:flex;align-items:flex-end;gap:16px;margin:6px 0 28px}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pc .av{width:112px;height:112px;font-size:44px;margin-bottom:12px}
.pc.c2 .av,.pc.c3 .av{background:#8c8581}
.pc .n{font-size:32px;font-weight:700;line-height:1.1}
.pc .c{font-size:26px;color:var(--muted);margin:4px 0 12px}
.plinth{width:100%;border-radius:24px 24px 0 0;background:#8c8581;color:#fff;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900}
.c1 .plinth{height:200px;background:var(--grad)}
.c2 .plinth{height:146px}
.c3 .plinth{height:104px;background:#aaa39f}
.lrow{display:flex;align-items:center;gap:20px;padding:14px 8px;border-bottom:2px solid var(--line)}
.lrow:last-of-type{border-bottom:0}
.lrow .rk{width:48px;font-size:38px;font-weight:900;color:var(--muted);text-align:center}
.lrow .av{width:68px;height:68px;font-size:28px;background:#8c8581}
.lrow .nm{width:190px;flex:none;font-size:32px;font-weight:700}
.bar{flex:1;height:22px;border-radius:11px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:11px;background:var(--grad)}
.lrow .ct{width:70px;text-align:right;font-size:36px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.total{margin-top:22px;padding:22px 26px;border-radius:24px;background:var(--soft);font-size:28px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:20px}
.total b{font-size:40px;color:var(--ink);font-weight:900}

footer{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:24px;color:#5a5552}

.semsec{margin-top:22px}
.semhead{display:flex;align-items:center;height:64px;padding:0 24px;border-radius:20px;color:#fff;background:var(--grad);font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.semnone{padding:22px 24px;font-size:26px;color:var(--muted)}
.clab{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px 4px}
/* Leaderboard: Fußleiste, Leerzustand */
.pfoot{flex:none;padding:20px 32px 28px;border-top:2px solid var(--line);background:#fff}
.addbtn{width:100%;height:104px;border-radius:30px;background:var(--grad);color:#fff;font-size:36px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:18px;box-shadow:0 10px 22px rgba(226,35,26,.3);transition:transform .12s}

.pc.ghost{opacity:.35}
.pc.ghost .av{background:#c9c3bf}
.empty{padding:70px 20px;text-align:center;font-size:34px;font-weight:500;color:var(--muted)}
/* Eintragen-Dialog */
.mback{position:absolute;inset:0;z-index:50;background:rgba(24,18,17,.66);display:flex;align-items:center;justify-content:center}
.modal{width:960px;background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.mhead{height:108px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 40px}
.mhead h2{margin:0;font-size:44px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.xbtn{width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.9);color:#fff;display:flex;align-items:center;justify-content:center}

.mbody{padding:28px 36px 36px}

.mchips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.chip.nm{min-width:0;min-height:76px;padding:0 24px;font-size:29px}

.caret{display:inline-block;width:4px;height:48px;margin-left:4px;background:var(--red);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.krow{display:flex;gap:10px;justify-content:center}
.key{flex:1;min-width:0;height:84px;border-radius:18px;background:#fff;border:3px solid var(--line);font-size:34px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.key:active{transform:scale(.93);background:var(--soft)}
.key.wide{flex:1.7;background:var(--soft)}
.key.space{flex:1;font-size:28px;color:var(--muted)}
.key svg{width:40px;height:40px}
.cnt{display:flex;align-items:center;justify-content:center;gap:34px;margin-bottom:26px}
.rbtn{width:112px;height:112px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .1s}
.rbtn.plus{width:132px;height:132px;border:0;background:var(--grad);color:#fff;box-shadow:0 10px 22px rgba(226,35,26,.3)}
.rbtn:active{transform:scale(.93)}
.rbtn svg{width:54px;height:54px}
.rbtn.plus svg{width:64px;height:64px}
.cval{min-width:230px;text-align:center;line-height:1}

.cval span{display:block;margin-top:6px;font-size:30px;color:var(--muted)}
.mact{display:flex;gap:18px}
.mact button{flex:1;height:100px;border-radius:30px;font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.mact .cancel{border:3px solid var(--line);background:#fff}
.mact .save{background:var(--grad);color:#fff;box-shadow:0 10px 22px rgba(226,35,26,.3)}

.toast{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:252px;z-index:60;max-width:900px;padding:24px 44px;border-radius:44px;background:#242220;color:#fff;font-size:32px;font-weight:500;text-align:center;animation:in .26s ease both}
:focus-visible{outline:6px solid var(--orange);outline-offset:3px}

async function loadSchedule(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r = await fetch('schedule.json?'+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    SCH = await r.json();
    try{ localStorage.setItem('sched-v1', JSON.stringify(SCH)); }catch(e){}
    if(S.tab==='plan'||S.tab==='termine'){ sync(); drawPanel(false); }
  }catch(e){}
}

function vPlan(){
  if(!SCH) return `<div class="empty">${t('Kein Stundenplan geladen')}</div>`;
  const days=studyDays(), cur=days.includes(S.date)?S.date:days[0];
  if(!cur) return `<div class="empty">${t('Keine weiteren Termine im Plan')}</div>`;
  const now=new Date(), nm=now.getHours()*60+now.getMinutes(), isToday=cur===ymd(now);
  const chips=days.map(d=>`<button class="chip day ${d===cur?'on':''}" data-act="day" data-v="${d}"><b>${wdOf(d)}</b><span>${dm(parse(d))}</span></button>`).join('');
  const day=SCH.lessons.filter(l=>l.date===cur);
  const sections=semList().map(sem=>{
    const list=day.filter(l=>l.sems.includes(sem)).sort((a,b)=>mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end));
    const nextStart=Math.min(...list.map(l=>mins(l.start)).filter(m=>m>nm));   /* parallele Veranstaltungen zählen gemeinsam als "Als Nächstes" */
    const rows=list.map(l=>{
    let st='',pill='';
    if(isToday){
      if(nm>=mins(l.start)&&nm<mins(l.end)){st='now';pill=`<span class="pill">${t('Läuft jetzt')}</span>`}
      else if(nm>=mins(l.end)){st='done'}
      else if(mins(l.start)===nextStart){pill=`<span class="pill">${t('Als Nächstes')}</span>`}
    }
    const room=l.online?t('Online'):l.room?`${t('Raum')} ${esc(l.room.replace(/tba|tbd/gi,LI?'tbc':'folgt'))}`:(l.tbd?t('Raum folgt'):'');
    const meta=[l.who?esc(l.who):'',room].filter(Boolean).join(' · ');
    const others=l.sems.filter(n=>n!==sem);
    const joint=others.length?`<span class="tag">${LI?'Joint with sem.':'Gemeinsam mit'} ${others.map(n=>n+'.').join(' · ')}${LI?'':' Semester'}</span>`:'';
    const tags=joint+(l.dual?'<span class="tag">Dual</span>':'')+(l.provisional?`<span class="tag warn">${t('Vorläufig')}</span>`:'');
    return `<div class="row ${st}"><div class="tm"><b>${l.start}</b><span>${l.end}</span></div><div class="info">${pill}<h3>${esc(t(l.title))}</h3>${meta?`<p>${meta}</p>`:''}${tags}</div></div>`;
    }).join('');
    const head=`<div class="semhead"><b>${LI?`${ord(sem)} semester`:`${sem}. Semester`}</b></div>`;
    return `<section class="semsec">${head}${rows||`<div class="semnone">${t('Keine Termine')}</div>`}</section>`;
  }).join('');
  return `<div class="chips">${chips}</div>${sections}`;
}
function vEvents(){
  const today=midnight(new Date());
  const list=EVENTS.filter(e=>parse(e.d)>=today).sort((a,b)=>(a.d+(a.time||'')).localeCompare(b.d+(b.time||'')));
  if(!list.length) return `<div class="empty">${t('Keine Events geplant')}</div>`;
  return list.map(e=>{
    const d=parse(e.d), line=[e.time?e.time+uhr():'',e.o?esc(t(e.o)):''].filter(Boolean).join(' · ');
    return `<div class="row"><div class="badge"><b>${p2(d.getDate())}</b><span>${monN()[d.getMonth()]}</span></div><div class="info"><h3>${esc(t(e.t))}</h3>${line?`<p>${line}</p>`:''}${e.g?`<span class="tag">${esc(t(e.g))}</span>`:''}</div></div>`;
  }).join('');
}
function vTermine(){
  if(!SCH) return `<div class="empty">${t('Kein Stundenplan geladen')}</div>`;
  const today=ymd(new Date()), t0=midnight(new Date());
  const items=[
    ...SCH.events.map(e=>({k:'e',from:e.date,to:e.date,title:e.title,time:e.time,place:e.online?'Online':e.place,tbd:e.tbd,prov:e.provisional})),
    ...SCH.notes.map(n=>({k:'n',from:n.from,to:n.to,title:n.text}))
  ].filter(x=>x.to>=today).sort((a,b)=>a.from.localeCompare(b.from));
  if(!items.length) return `<div class="empty">${t('Keine weiteren Termine im Plan')}</div>`;
  return items.map(x=>{
    const d=parse(x.from), diff=Math.round((d-t0)/864e5);
    const range=x.to!==x.from?`${dm(d)} – ${dmy(parse(x.to))}`:dmy(d);
    const tm=x.time?x.time+(/^\d{2}:\d{2}$/.test(x.time)?uhr():''):'';
    const pl=x.place?esc(x.place):(x.tbd?t('Ort folgt'):'');
    const line2=[tm,pl].filter(Boolean).join(' · ');
    let w,cl='';
    if(x.from<=today&&x.to>=today){w=x.from===x.to?t('Heute'):t('Läuft jetzt');cl='today'}
    else if(diff===1){w=t('Morgen');cl='hot'}
    else {w=LI?`in ${diff} days`:`in ${diff} Tagen`;if(diff<=14)cl='hot'}
    const prov=x.prov?`<span class="tag warn">${t('Vorläufig')}</span>`:'';
    return `<div class="row compact"><div class="badge ${x.k==='n'?'alt':''}"><b>${p2(d.getDate())}</b><span>${monN()[d.getMonth()]}</span></div><div class="info"><span class="when ${cl}">${w}</span><h3>${esc(t(x.title))}</h3><p>${range}${line2?'<br>'+line2:''}</p>${prov}</div></div>`;
  }).join('');
}
function vMensa(){

  return `<div class="chips">${chips}</div>${dishes}`;

  const max=rank[0].v;
  const pc=(r,i,cls)=>r?`<div class="pc ${cls}"><div class="av">${esc(initials(r.n))}</div><div class="n">${esc(r.n)}</div><div class="c">${r.v} ${cupsT(r.v)}</div><div class="plinth">${i}</div></div>`
                       :`<div class="pc ${cls} ghost"><div class="av">–</div><div class="n">&nbsp;</div><div class="c">&nbsp;</div><div class="plinth">${i}</div></div>`;
  const podium=`<div class="podium">${pc(rank[1],2,'c2')}${pc(rank[0],1,'c1')}${pc(rank[2],3,'c3')}</div>`;
  const rest=rank.slice(3).map((r,i)=>`<div class="lrow"><div class="rk">${i+4}</div><div class="av">${esc(initials(r.n))}</div><div class="nm">${esc(r.n)}</div><div class="bar"><i style="width:${Math.round(r.v/max*100)}%"></i></div><div class="ct">${r.v}</div></div>`).join('');
  return `<div class="chips">${chips}</div>${podium}${rest}<div class="total"><span>${t('Getrunkene Tassen in dieser Wertung')}</span><b>${sum}</b></div>`;
}
const ICON_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>';
const ICON_MINUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>';
const ICON_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
const footKaffee=()=>`<div class="pfoot"><button class="addbtn" data-act="kopen">${ICON_PLUS}<span>${t('Kaffee eintragen')}</span></button></div>`;

const TABS=[
  {id:'plan',   lb:'Stundenplan',       title:'Stundenplan',                 sub:()=>PROGRAM[LI?1:0], ic:'plan', v:vPlan},
  {id:'events', lb:'Events',            title:'Events',                      sub:'Das passiert demnächst auf dem Campus', ic:'events',  v:vEvents},
  {id:'termine',lb:'Wichtige Termine',  title:'Wichtige Termine',            sub:'Fristen und Semesterzeiten',            ic:'termine', v:vTermine},
  {id:'mensa',  lb:'Mensaplan',         title:'Mensaplan',                   sub:'Preise für Studierende',                ic:'mensa',   v:vMensa},
  {id:'profs',  lb:'Profs Kontakt',     title:'Profs Kontakt Informationen', sub:'Räume, Sprechzeiten, Erreichbarkeit',   ic:'profs',   v:vProfs},
  {id:'kaffee', lb:'Kaffee Leaderboard',title:'Kaffee Leaderboard',          sub:'Wer trinkt die meisten Tassen?',        ic:'kaffee',  v:vKaffee, foot:footKaffee}
];

/* ===== Kaffee: Speicher und Eintrag ===== */
async function loadMensa(redraw){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch('api/mensa?'+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    MENSA=await r.json();
    if(redraw&&S.tab==='mensa'&&!S.modal) drawPanel(false);
  }catch(e){}
}
async function loadList(kind,redraw){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch(`api/${kind}?`+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const items=(await r.json()).items;
    if(kind==='events') EVENTS=items; else PROFS=items;
    if(redraw&&S.tab===kind&&!S.modal) drawPanel(false);
  }catch(e){}
}
let KROWS=[];
async function loadK(redraw){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch('api/coffee?'+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    KROWS=(await r.json()).rows;
    if(redraw&&S.tab==='kaffee'&&!S.modal) drawPanel(false);
  }catch(e){}
}
/* Trägt Tassen auf dem Server ein. Gibt {ok:true,who} oder {ok:false,msg} zurück. */
async function addScore(name,c){
  name=name.trim().replace(/\s+/g,' ');
  try{
    const r=await fetch('api/coffee',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,cups:c})});
    const j=await r.json();
    if(j.ok){ KROWS=j.rows; return {ok:true,who:(KROWS.find(x=>x.n.toLowerCase()===name.toLowerCase())||{n:name}).n}; }
    if(r.status===429){
      const rem=j.remaining, m=j.retry_minutes;
      return {ok:false,msg:LI?`Limit reached: max. ${KMAX} cups per hour. ${rem>0?`You can still add ${rem}. `:''}Try again in ${m} min.`
                             :`Limit erreicht: max. ${KMAX} Tassen pro Stunde. ${rem>0?`Noch ${rem} möglich. `:''}Nächster Versuch in ${m} Min.`};
    }
  }catch(e){}
  return {ok:false,msg:LI?'Could not save. Please try again.':'Speichern nicht möglich. Bitte erneut versuchen.'};
}
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true},3800);
}
function addChar(ch){
  const n=S.modal.name; if(n.length>=14) return;
  const prev=n.slice(-1), up=(n===''||prev===' '||prev==='-');
  S.modal.name=n+(up?ch.toUpperCase():ch.toLowerCase());
}
function drawModal(){
  const el=document.getElementById('modal');
  if(!S.modal){el.hidden=true;el.innerHTML='';return}
  const m=S.modal, cur=m.name.trim().toLowerCase();
  const names=KROWS.slice().sort((a,b)=>b.v[2]-a.v[2]).slice(0,8).map(r=>r.n);
  const chips=names.map(n=>`<button class="chip nm ${n.toLowerCase()===cur?'on':''}" data-act="kname" data-v="${esc(n)}">${esc(n)}</button>`).join('');
  const key=c=>`<button class="key" data-act="kkey" data-v="${c}">${c}</button>`;
  const kb=`<div class="kb">
    <div class="krow">${[...'QWERTZUIOPÜ'].map(key).join('')}</div>
    <div class="krow">${[...'ASDFGHJKLÖÄ'].map(key).join('')}</div>
    <div class="krow">${[...'YXCVBNM.-'].map(key).join('')}<button class="key wide" data-act="kback" aria-label="Backspace">${ICON_BACK}</button></div>
    <div class="krow"><button class="key space" data-act="kspace">${t('Leerzeichen')}</button></div></div>`;
  const ok=m.name.trim().length>0;
  el.hidden=false;
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${t('Kaffee eintragen')}">
    <div class="mhead"><h2>${t('Kaffee eintragen')}</h2><button class="xbtn" data-act="kclose" aria-label="${t('Schließen')}">${ICON_X}</button></div>
    <div class="mbody">
      <div class="mlab">${t('Name auswählen')}</div><div class="mchips">${chips}</div>
      <div class="mlab">${t('oder neuen Namen eintippen')}</div>
      <div class="nfield">${m.name?esc(m.name):`<span class="ph">${t('Name')}</span>`}<i class="caret"></i></div>
      ${kb}
      <div class="mlab" style="text-align:center">${t('Anzahl Tassen')}</div>
      <div class="cnt"><button class="rbtn" data-act="kminus" aria-label="-1">${ICON_MINUS}</button><div class="cval"><b>${m.cups}</b><span>${cupsT(m.cups)}</span></div><button class="rbtn plus" data-act="kplus" aria-label="+1">${ICON_PLUS}</button></div>
      <div class="mact"><button class="cancel" data-act="kclose">${t('Abbrechen')}</button><button class="save ${ok?'':'off'}" data-act="ksave">${t('Speichern')}</button></div>
    </div></div>`;
}

/* ===== Rendering ===== */
const nav=document.getElementById('nav'), panel=document.getElementById('panel');
function sync(){
  LI = S.lang==='en' ? 1 : 0;
  document.documentElement.lang = LI ? 'en' : 'de';
  document.getElementById('ftl').textContent = t('Tippen Sie auf ein Symbol, um Informationen anzuzeigen.');
  document.getElementById('ftr').textContent = ((S.tab==='plan'||S.tab==='termine') && SCH && SCH.meta) ? `${t('Stand')}: ${dmy(new Date(SCH.meta.generated))}` : S.tab==='mensa' ? t('Quelle: Studierendenwerk Oberfranken') : '';
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lang));
  tick();
}
function drawNav(){
  nav.innerHTML=TABS.map(x=>`<button class="tab" role="tab" aria-selected="${x.id===S.tab}" data-act="tab" data-v="${x.id}">${ICON[x.ic]}<span class="lb">${t(x.lb)}</span>${ARROW}</button>`).join('');
}
function drawPanel(animate){
  const x=TABS.find(y=>y.id===S.tab), sub=typeof x.sub==='function'?x.sub():t(x.sub);
  panel.innerHTML=`<div class="phead">${ICON[x.ic]}<div><h1>${t(x.title)}</h1><p>${sub}</p></div></div><div class="pbody ${animate?'anim':''}" role="tabpanel">${x.v()}</div>${x.foot?x.foot():''}`;
}
function drawAll(animate){sync();drawNav();drawPanel(animate);drawModal()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='lang'){ if(S.lang===v) return; S.lang=v; document.getElementById('toast').hidden=true; drawAll(false); return; }
  if(a==='tab'){ if(S.tab===v) return; S.tab=v; drawAll(true); if(v==='kaffee') loadK(true); else if(v==='events'||v==='profs') loadList(v,true); else if(v==='mensa') loadMensa(true); return; }
  if(a==='kopen'){ S.modal={name:'',cups:1}; document.getElementById('toast').hidden=true; drawModal(); return; }
  if(a==='kclose'){ S.modal=null; drawModal(); return; }
  if(S.modal && a.charAt(0)==='k'){
    if(a==='kname') S.modal.name=v;
    else if(a==='kkey') addChar(v);
    else if(a==='kback') S.modal.name=S.modal.name.slice(0,-1);
    else if(a==='kspace'){ const n=S.modal.name; if(n&&!n.endsWith(' ')&&n.length<14) S.modal.name=n+' '; }
    else if(a==='kplus') S.modal.cups=Math.min(KMAX,S.modal.cups+1);
    else if(a==='kminus') S.modal.cups=Math.max(1,S.modal.cups-1);
    else if(a==='ksave'){
      if(!S.modal.name.trim()) return;
      const c=S.modal.cups, nm=S.modal.name;
      S.modal=null; drawModal();
      addScore(nm,c).then(res=>{
        if(!res.ok){ toast(res.msg); return; }
        if(S.tab==='kaffee') drawPanel(false);
        const who=res.who, order=KROWS.map(r=>({n:r.n,v:r.v[S.per]})).sort((x,y)=>y.v-x.v), pos=order.findIndex(r=>r.n===who)+1;
        toast(LI?`Thanks! +${c} ${cupsT(c)} for ${who} · rank ${pos}`:`Danke! +${c} ${cupsT(c)} für ${who} · Platz ${pos}`);
      });
      return;
    }
    drawModal(); return;
  }
  if(a==='day')  S.date=v;
  if(a==='mdate') S.mdate=v;
  if(a==='fak')  S.fak=v;
  if(a==='per')  S.per=+v;
  drawPanel(true);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* Uhr */
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=p2(n.getHours())+':'+p2(n.getMinutes());
  const ds=n.toLocaleDateString(LI?'en-GB':'de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('dat').textContent=ds;
  document.getElementById('aclk').textContent=p2(n.getHours())+':'+p2(n.getMinutes());
  document.getElementById('adat').textContent=ds;
}
setInterval(tick,1000);
setInterval(()=>{loadK(true);loadList('events',true);loadList('profs',true);loadMensa(true)},60000);
setInterval(()=>{ if(S.tab==='plan'){const y=document.querySelector('.pbody'),s=y?y.scrollTop:0;drawPanel(false);const z=document.querySelector('.pbody');if(z)z.scrollTop=s;} },60000);

/* Skalierung auf die Fenstergröße (auf dem 1080x1920-Display 1:1) */
const vp=document.getElementById('vp'), st=document.getElementById('stage');
function fit(){
  const w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/1080,h/1920);
  st.style.transform=`translate(${(w-1080*s)/2}px,${(h-1920*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();

/* ===== Ruhebildschirm: nach 1 Minute ohne Berührung Uhr + wechselnde Infokarten (alle 20 s) ===== */
const ATTRACT_IDLE=60000, ATTRACT_EVERY=20000;
const AT=document.getElementById('attract'), ASLIDE=document.getElementById('aslide');
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const dayLabel=(d,today)=>d===today?'heute':`${wdOf(d)} ${dm(parse(d))}`;
function aMensa(){
  const days=MENSA.days||{}, today=ymd(new Date());
  const d=days[today]?today:Object.keys(days).filter(x=>x>today).sort()[0];
  if(!d) return null;
  const all=days[d].filter(x=>['main','vegan','night','pizza'].includes(x.c)), pool=all.filter(x=>x.i).length?all.filter(x=>x.i):all;
  if(!pool.length) return null;
  const x=rnd(pool), tags=x.s.filter(n=>MSYM[n]).map(n=>`<span class="tag ${(n===53||n===54)?'v':''}">${MSYM[n][0]}</span>`).join('');
  return `<div class="alab">${d===today?'Heute in der Mensa':`Mensa · ${dayLabel(d,today)}`}</div>`
    +(x.i?`<img class="aimg" src="mensa-img/${esc(x.i)}" alt="" onerror="this.remove()">`:'')
    +`<div class="at">${esc(x.t)}</div>`+(x.p!=null?`<div class="aprice">${priceT(x.p)} €<small>Studierende</small></div>`:'')
    +(tags?`<div class="atags">${tags}</div>`:'');
}
function aEvent(){
  const today=midnight(new Date()), list=EVENTS.filter(e=>parse(e.d)>=today).sort((a,b)=>(a.d+(a.time||'')).localeCompare(b.d+(b.time||''))).slice(0,4);
  if(!list.length) return null;
  const rows=list.map(e=>{
    const d=parse(e.d), line=[e.time?e.time+' Uhr':'',e.o||'',e.g||''].filter(Boolean).join(' · ');
    return `<div class="aev"><div class="bd"><b>${p2(d.getDate())}</b><span>${MON[d.getMonth()]}</span></div><div class="ev"><div class="at">${esc(e.t)}</div>${line?`<div class="asub">${esc(line)}</div>`:''}</div></div>`;
  }).join('');
  return `<div class="alab">Events auf dem Campus</div><div class="alist lg">${rows}</div>`;
}
function aPlan(){
  if(!SCH) return null;
  const today=ymd(new Date()), d=[...new Set(SCH.lessons.map(l=>l.date))].sort().find(x=>x>=today);
  if(!d) return null;
  const day=SCH.lessons.filter(l=>l.date===d), MAXROWS=3;
  const secs=semList().map(sem=>{
    const list=day.filter(l=>l.sems.includes(sem)).sort((a,b)=>mins(a.start)-mins(b.start)), shown=list.slice(0,MAXROWS);
    const rows=shown.map(l=>{
      const room=l.online?'Online':l.room?`Raum ${l.room.replace(/tba|tbd/gi,'folgt')}`:(l.tbd?'Raum folgt':'');
      return `<div class="it"><div class="tm">${l.start}<small>${l.end}</small></div><div class="nm">${esc(l.title)}${room?`<small>${esc(room)}</small>`:''}</div></div>`;
    }).join('');
    return `<div class="asec"><div class="asem">${sem}. Semester</div>${rows||'<div class="amore">Keine Termine</div>'}`
      +(list.length>shown.length?`<div class="amore">+ ${list.length-shown.length} weitere</div>`:'')+`</div>`;
  }).join('');
  return `<div class="alab">Stundenplan · ${d===today?'heute':dayLabel(d,today)}</div><div class="alist">${secs}</div>`;
}
function aTermin(){
  if(!SCH||!SCH.events) return null;
  const today=ymd(new Date()), t0=midnight(new Date());
  const list=SCH.events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  if(!list.length) return null;
  const rows=list.map(e=>{
    const diff=Math.round((parse(e.date)-t0)/864e5), w=diff===0?'Heute':diff===1?'Morgen':`in ${diff} Tagen`;
    const d=parse(e.date);
    return `<div class="aev"><div class="bd"><b>${p2(d.getDate())}</b><span>${MON[d.getMonth()]}</span></div><div class="ev"><div class="at">${esc(e.title)}</div><div class="asub wh">${w}</div></div></div>`;
  }).join('');
  return `<div class="alab">Wichtige Termine</div><div class="alist lg">${rows}</div>`;
}
function aKaffee(){
  for(const [i,lb] of [[0,'heute'],[1,'diese Woche'],[2,'im Semester']]){
    const top=KROWS.filter(r=>r.v[i]>0).sort((a,b)=>b.v[i]-a.v[i]).slice(0,5);
    if(!top.length) continue;
    return `<div class="alab">Kaffee-Leaderboard · ${lb}</div><div class="alist lg">`+top.map((r,k)=>`<div class="apod"><div class="rk">${k+1}</div><div class="nm">${esc(r.n)}</div><div class="ct">${r.v[i]} ${cupsT(r.v[i])}</div></div>`).join('')+`</div>`;
  }
  return null;
}
const ASLIDES=[aMensa,aEvent,aPlan,aTermin,aKaffee];
let atTimer=null, atIdx=-1;
function atNext(first){
  let html=null, k=atIdx;
  for(let n=0;n<ASLIDES.length&&!html;n++){ k=(k+1)%ASLIDES.length; html=ASLIDES[k](); }
  if(!html) return;
  const apply=()=>{ ASLIDE.innerHTML=html; atIdx=k; document.querySelectorAll('#adots i').forEach((d,i)=>d.classList.toggle('on',i===k)); ASLIDE.classList.remove('out'); };
  if(first){ apply(); return; }
  ASLIDE.classList.add('out'); setTimeout(apply,450);
}
function showAttract(){
  if(!AT.hidden) return;
  S=fresh(); drawAll(false); document.getElementById('toast').hidden=true;
  document.getElementById('alogo').src=document.getElementById('logo').src;
  document.getElementById('adots').innerHTML=ASLIDES.map(()=>'<i></i>').join('');
  AT.hidden=false; tick(); atIdx=-1; atNext(true);
  atTimer=setInterval(()=>atNext(false),ATTRACT_EVERY);
}
function hideAttract(){ AT.hidden=true; clearInterval(atTimer); bump(); }
AT.addEventListener('click',hideAttract);   /* erst beim click (nicht pointerdown), damit die Berührung nicht auf ein Element darunter durchschlägt */

/* Kiosk: nach 1 Minute ohne Berührung Ruhebildschirm (dabei zurück zum Start und zur deutschen Sprache) */
let idle;
function bump(){clearTimeout(idle);idle=setTimeout(showAttract,ATTRACT_IDLE)}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,bump,{passive:true}));
bump();

loadK(true); loadList('events',true); loadList('profs',true); loadMensa(true);
drawAll(false);
loadSchedule();
setInterval(loadSchedule, 60*1000);
</script>
