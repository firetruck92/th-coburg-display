<title>Campus Display Coburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout: Kiosk-Bühne 1080x1920 (Hochformat, ET4363L). Links 6 große Tabs, rechts das aktive Fenster.
   Die Bühne wird per JS auf jede Fenstergröße skaliert; auf dem Display selbst gilt Maßstab 1:1. */
:root{
  --red:#e2231a;
  --orange:#ff6a00;
  --grad:linear-gradient(100deg,#e2231a 0%,#ff6a00 100%);
  --ink:#242220;
  --muted:#686260;
  --line:#e6e1de;
  --soft:#f6f3f1;
  --card:#ffffff;
  --ground:linear-gradient(180deg,#c9c9c9 0%,#e7e7e7 100%);
  --green:#2c7a31;
  --green-bg:#e5f2e6;
  --font:'Roboto','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1a19;color:var(--ink);font-family:var(--font)}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
#vp{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--ground)}

/* Kopfzeile */
header{height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 44px}
.wordmark{display:flex;flex-direction:column;line-height:1;font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.wordmark span{font-weight:400}
.wordmark b{font-weight:900}
.clock{text-align:right;line-height:1.05}
.clock .t{font-size:66px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{font-size:26px;font-weight:400;opacity:.95;margin-top:4px}

/* Hauptbereich */
main{flex:1;min-height:0;display:flex;gap:24px;padding:28px 28px 12px}
nav{width:320px;flex:none;display:flex;flex-direction:column;gap:20px}
.tab{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:22px 24px;border-radius:28px;background:var(--card);color:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .12s ease,background .2s}
.tab svg.ic{width:92px;height:92px}
.tab .lb{font-size:28px;line-height:1.12;font-weight:700;text-transform:uppercase;letter-spacing:.01em;max-width:232px}
.tab .ar{position:absolute;right:22px;bottom:24px;width:34px;height:34px;color:#6d625d}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 12px 26px rgba(226,35,26,.35)}
.tab[aria-selected="true"] .ar{color:#fff}

/* Aktives Fenster */
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);border-radius:32px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.phead{height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;gap:22px;padding:0 36px}
.phead svg{width:68px;height:68px;flex:none}
.phead h1{margin:0;font-size:50px;line-height:1;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.phead p{margin:8px 0 0;font-size:26px;opacity:.95}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:28px 32px 32px;touch-action:pan-y;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{width:14px}
.pbody::-webkit-scrollbar-thumb{background:#c9c3bf;border-radius:8px}
.pbody::-webkit-scrollbar-track{background:transparent}
.anim{animation:in .26s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Auswahl-Chips */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.chip{min-height:88px;padding:0 26px;border-radius:44px;border:3px solid var(--line);background:#fff;font-size:29px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:700}
.chip.day{flex:1;min-height:108px;border-radius:26px;flex-direction:column;gap:2px;padding:0 8px}
.chip.day b{font-size:32px;font-weight:700;text-transform:uppercase}
.chip.day span{font-size:24px;opacity:.85}
.chip.per{flex:1}

/* Zeilen */
.row{display:flex;gap:26px;padding:22px 18px;border-bottom:2px solid var(--line);border-radius:22px}
.row:last-child{border-bottom:0}
.row.now{background:#fff1e6;border-bottom-color:transparent}
.row.done{opacity:.45}
.tm{width:124px;flex:none}
.tm b{display:block;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tm span{display:block;margin-top:8px;font-size:27px;color:var(--muted);font-variant-numeric:tabular-nums}
.info{min-width:0;flex:1}
.info h3{margin:0;font-size:35px;line-height:1.15;font-weight:700}
.info p{margin:8px 0 0;font-size:27px;line-height:1.3;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;font-size:23px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--grad);color:#fff;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:19px;font-size:23px;font-weight:500;border:2px solid var(--line);color:var(--muted);margin:10px 8px 0 0}
.tag.v{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:700}

/* Events / Termine */
.badge{width:116px;height:116px;flex:none;border-radius:26px;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.badge b{font-size:54px;font-weight:900}
.badge span{font-size:25px;font-weight:700;text-transform:uppercase;margin-top:6px;letter-spacing:.04em}
.badge.alt{background:var(--soft);color:var(--ink)}
.when{flex:none;align-self:center;text-align:center;min-width:150px;height:54px;padding:0 16px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;background:var(--soft);color:var(--muted)}
.when.hot{background:#ffe9d8;color:#c4400a}
.when.today{background:var(--grad);color:#fff}

/* Mensa */
.dish{display:flex;gap:20px;align-items:center;padding:24px 22px;margin-bottom:16px;border-radius:26px;background:var(--soft)}
.dish .cat{font-size:23px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin-bottom:6px}
.dish h3{margin:0;font-size:35px;line-height:1.15;font-weight:700}
.price{flex:none;text-align:right;font-size:44px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums;line-height:1}
.price small{display:block;margin-top:8px;font-size:21px;font-weight:500;color:var(--muted)}

/* Profs */
.prof{display:flex;gap:22px;padding:24px;margin-bottom:16px;border-radius:26px;background:var(--soft)}
.av{width:96px;height:96px;flex:none;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700}
.prof h3{margin:0;font-size:35px;font-weight:700;line-height:1.15}
.prof .f{font-size:27px;color:var(--red);font-weight:700;margin-top:4px}
.prof p{margin:6px 0 0;font-size:27px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
.prof p b{color:var(--ink);font-weight:500}

/* Leaderboard */
.podium{display:flex;align-items:flex-end;gap:16px;margin:6px 0 28px}
.pc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pc .av{width:112px;height:112px;font-size:44px;margin-bottom:12px}
.pc.c2 .av,.pc.c3 .av{background:#8c8581}
.pc .n{font-size:32px;font-weight:700;line-height:1.1}
.pc .c{font-size:26px;color:var(--muted);margin:4px 0 12px}
.plinth{width:100%;border-radius:24px 24px 0 0;background:#8c8581;color:#fff;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900}
.c1 .plinth{height:200px;background:var(--grad)}
.c2 .plinth{height:146px}
.c3 .plinth{height:104px;background:#aaa39f}
.lrow{display:flex;align-items:center;gap:20px;padding:14px 8px;border-bottom:2px solid var(--line)}
.lrow:last-of-type{border-bottom:0}
.lrow .rk{width:48px;font-size:38px;font-weight:900;color:var(--muted);text-align:center}
.lrow .av{width:68px;height:68px;font-size:28px;background:#8c8581}
.lrow .nm{width:190px;flex:none;font-size:32px;font-weight:700}
.bar{flex:1;height:22px;border-radius:11px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:11px;background:var(--grad)}
.lrow .ct{width:70px;text-align:right;font-size:36px;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.total{margin-top:22px;padding:22px 26px;border-radius:24px;background:var(--soft);font-size:28px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.total b{font-size:40px;color:var(--ink);font-weight:900}

footer{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:24px;color:#5a5552}

:focus-visible{outline:6px solid var(--orange);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.anim{animation:none}.tab,.chip{transition:none}}
</style>

const p2=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dm=d=>p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.';

const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
function weekDates(){
  const t=midnight(new Date()), dow=t.getDay();
  const mon=new Date(t); mon.setDate(t.getDate()-((dow+6)%7)+((dow===0||dow===6)?7:0));
  return [0,1,2,3,4].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x});

function todayIdx(){const d=new Date().getDay();return (d===0||d===6)?0:d-1}

  const rows=PLAN[S.day].map(l=>{

    if(isToday){
      if(nm>=mins(l.s)&&nm<mins(l.e)){st='now';pill='<span class="pill">Läuft jetzt</span>'}
      else if(nm>=mins(l.e)){st='done'}
      else if(!nextDone){nextDone=true;pill='<span class="pill">Als Nächstes</span>'}
    }
    return `<div class="row ${st}"><div class="tm"><b>${l.s}</b><span>${l.e}</span></div><div class="info">${pill}<h3>${esc(l.t)}</h3><p>${l.k} · ${esc(l.w)}<br>Raum ${esc(l.r)}</p></div></div>`;
  }).join('');
  return `<div class="chips">${chips}</div>${rows}`;
}
function vEvents(){
  const today=midnight(new Date());
  return EVENTS.filter(e=>parse(e.d)>=today).map(e=>{
    const d=parse(e.d);
    return `<div class="row"><div class="badge"><b>${p2(d.getDate())}</b><span>${MON[d.getMonth()]}</span></div><div class="info"><h3>${esc(e.t)}</h3><p>${e.time} Uhr · ${esc(e.o)}</p><span class="tag">${e.g}</span></div></div>`;
  }).join('');
}
function vTermine(){
  const today=midnight(new Date());
  return TERMINE.filter(x=>parse(x.e||x.d)>=today).map(x=>{
    const d=parse(x.d), diff=Math.round((d-today)/864e5);
    const range=x.e?`${dm(d)} – ${dmy(parse(x.e))}`:dmy(d);
    let w,cl='';
    if(diff<=0){w='Heute';cl='today'} else if(diff===1){w='Morgen';cl='hot'} else {w=`in ${diff} Tagen`;if(diff<=14)cl='hot'}
    return `<div class="row"><div class="badge alt"><b>${p2(d.getDate())}</b><span>${MON[d.getMonth()]}</span></div><div class="info"><h3>${esc(x.t)}</h3><p>${range}<br>${esc(x.n)}</p></div><div class="when ${cl}">${w}</div></div>`;
  }).join('');
}
function vMensa(){
  const days=weekDates();
  const chips=days.map((d,i)=>`<button class="chip day ${i===S.mday?'on':''}" data-act="mday" data-v="${i}"><b>${WD[i]}</b><span>${dm(d)}</span></button>`).join('');
  const dishes=MENSA[S.mday].map(x=>`<div class="dish"><div class="info"><div class="cat">${x.c}</div><h3>${esc(x.t)}</h3>${x.g.map(tagHtml).join('')}</div><div class="price">${x.p} €<small>Studierende</small></div></div>`).join('');
  return `<div class="chips">${chips}</div>${dishes}`;
}
function vProfs(){
  const fs=['Alle','Informatik','Wirtschaft','Design','Technik'];
  const chips=fs.map(f=>`<button class="chip ${f===S.fak?'on':''}" data-act="fak" data-v="${f}">${f}</button>`).join('');
  const list=PROFS.filter(p=>S.fak==='Alle'||p.f===S.fak).map(p=>`<div class="prof"><div class="av">${initials(p.n)}</div><div style="min-width:0"><h3>${esc(p.n)}</h3><div class="f">${p.f}</div><p><b>Raum ${p.r}</b> · Sprechstunde ${p.h} Uhr</p><p>${esc(p.m)}</p><p>${p.p}</p></div></div>`).join('');
  return `<div class="chips">${chips}</div>${list}`;
}
function vKaffee(){
  const P=KAFFEE.per[S.per];
  const rank=KAFFEE.names.map((n,i)=>({n,v:P.v[i]})).sort((a,b)=>b.v-a.v);
  const max=rank[0].v, sum=rank.reduce((a,b)=>a+b.v,0);
  const chips=KAFFEE.per.map((p,i)=>`<button class="chip per ${i===S.per?'on':''}" data-act="per" data-v="${i}">${p.k}</button>`).join('');
  const pc=(r,i,cls)=>`<div class="pc ${cls}"><div class="av">${initials(r.n)}</div><div class="n">${r.n}</div><div class="c">${r.v} Tassen</div><div class="plinth">${i}</div></div>`;
  const podium=`<div class="podium">${pc(rank[1],2,'c2')}${pc(rank[0],1,'c1')}${pc(rank[2],3,'c3')}</div>`;
  const rest=rank.slice(3).map((r,i)=>`<div class="lrow"><div class="rk">${i+4}</div><div class="av">${initials(r.n)}</div><div class="nm">${r.n}</div><div class="bar"><i style="width:${Math.round(r.v/max*100)}%"></i></div><div class="ct">${r.v}</div></div>`).join('');
  return `<div class="chips">${chips}</div>${podium}${rest}<div class="total"><span>Getrunkene Tassen in dieser Wertung</span><b>${sum}</b></div>`;
}

const TABS=[
  {id:'plan',   lb:'Stundenplan',      title:'Stundenplan',               sub:'Informatik · 3. Semester', ic:'plan',    v:vPlan},
  {id:'events', lb:'Events',           title:'Events',                    sub:'Das passiert demnächst auf dem Campus', ic:'events',  v:vEvents},
  {id:'termine',lb:'Wichtige Termine', title:'Wichtige Termine',          sub:'Fristen und Semesterzeiten', ic:'termine', v:vTermine},
  {id:'mensa',  lb:'Mensaplan',        title:'Mensaplan',                 sub:'Preise für Studierende', ic:'mensa',   v:vMensa},
  {id:'profs',  lb:'Profs Kontakt',    title:'Profs Kontakt Informationen',sub:'Räume, Sprechzeiten, Erreichbarkeit', ic:'profs', v:vProfs},
  {id:'kaffee', lb:'Kaffee Leaderboard',title:'Kaffee Leaderboard',       sub:'Wer trinkt die meisten Tassen?', ic:'kaffee',  v:vKaffee}
];

/* ===== Rendering ===== */
const nav=document.getElementById('nav'), panel=document.getElementById('panel');
function drawNav(){
  nav.innerHTML=TABS.map(t=>`<button class="tab" role="tab" aria-selected="${t.id===S.tab}" data-act="tab" data-v="${t.id}">${ICON[t.ic]}<span class="lb">${t.lb}</span>${ARROW}</button>`).join('');
}
function drawPanel(animate){
  const t=TABS.find(x=>x.id===S.tab);
  panel.innerHTML=`<div class="phead">${ICON[t.ic]}<div><h1>${t.title}</h1><p>${t.sub}</p></div></div><div class="pbody ${animate?'anim':''}" role="tabpanel">${t.v()}</div>`;
}
function drawAll(animate){drawNav();drawPanel(animate)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='tab'){ if(S.tab===v) return; S.tab=v; drawAll(true); return; }
  if(a==='day')  S.day=+v;
  if(a==='mday') S.mday=+v;
  if(a==='fak')  S.fak=v;
  if(a==='per')  S.per=+v;
  drawPanel(true);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* Uhr */
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=p2(n.getHours())+':'+p2(n.getMinutes());
  document.getElementById('dat').textContent=n.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tick(); setInterval(tick,1000);
setInterval(()=>{ if(S.tab==='plan'){const y=document.querySelector('.pbody'),s=y?y.scrollTop:0;drawPanel(false);const z=document.querySelector('.pbody');if(z)z.scrollTop=s;} },60000);

/* Skalierung auf die Fenstergröße (auf dem 1080x1920-Display 1:1) */
const vp=document.getElementById('vp'), st=document.getElementById('stage');
function fit(){
  const w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/1080,h/1920);
  st.style.transform=`translate(${(w-1080*s)/2}px,${(h-1920*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();

/* Kiosk: nach 2 Minuten ohne Berührung zurück zum Start */
let idle;
function bump(){clearTimeout(idle);idle=setTimeout(()=>{S=fresh();drawAll(true)},120000)}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,bump,{passive:true}));
bump();

drawAll(false);
</script>
