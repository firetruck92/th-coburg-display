<style>
/* Layout: Kiosk-Bühne 1080x1920 (Hochformat, ET4363L). Links 6 große Tabs, rechts das aktive Fenster.
   Die Bühne wird per JS auf jede Fenstergröße skaliert; auf dem Display selbst gilt Maßstab 1:1. */
:root{
  --red:#e2231a;
  --orange:#ff6a00;
  --grad:linear-gradient(100deg,#e2231a 0%,#ff6a00 100%);
  --ink:#242220;
  --muted:#686260;
  --line:#e6e1de;
  --soft:#f6f3f1;
  --card:#ffffff;
  --ground:linear-gradient(180deg,#c9c9c9 0%,#e7e7e7 100%);
  --green:#2c7a31;
  --green-bg:#e5f2e6;
  --font:'Roboto','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1a19;color:var(--ink);font-family:var(--font)}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
#vp{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;display:flex;flex-direction:column;background:var(--ground)}

/* Kopfzeile */
header{height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.brand{display:flex;align-items:center;min-width:0}
#logo{display:block;height:80px;width:auto;max-width:380px}
.wordmark{display:flex;flex-direction:column;line-height:1;font-size:40px;letter-spacing:.02em;text-transform:uppercase}
.wordmark span{font-weight:400}
.wordmark b{font-weight:900}
.hright{display:flex;align-items:center;gap:30px}
.lang{display:flex;gap:4px;padding:4px;border:3px solid rgba(255,255,255,.92);border-radius:44px}
.lang button{min-width:84px;height:68px;border-radius:34px;font-size:30px;font-weight:700;color:#fff;transition:background .15s}
.lang button:active{transform:scale(.95)}
.lang button.on{background:#fff;color:var(--red)}
.clock{text-align:right;line-height:1.05}
.clock .t{font-size:62px;font-weight:700;font-variant-numeric:tabular-nums}
.clock .d{font-size:25px;font-weight:400;opacity:.95;margin-top:4px;white-space:nowrap}

/* Hauptbereich */
main{flex:1;min-height:0;display:flex;gap:24px;padding:28px 28px 12px}
nav{width:320px;flex:none;display:flex;flex-direction:column;gap:20px}
.tab{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:22px 24px;border-radius:28px;background:var(--card);color:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.06);transition:transform .12s ease,background .2s}
.tab svg.ic{width:92px;height:92px}
.tab .lb{font-size:28px;line-height:1.12;font-weight:700;text-transform:uppercase;letter-spacing:.01em;max-width:232px}
.tab .ar{position:absolute;right:22px;bottom:24px;width:34px;height:34px;color:#6d625d}
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 12px 26px rgba(226,35,26,.35)}
.tab[aria-selected="true"] .ar{color:#fff}

/* Aktives Fenster */
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);border-radius:32px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.phead{min-height:128px;flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;gap:22px;padding:16px 36px}
.phead svg{width:68px;height:68px;flex:none}
.phead h1{margin:0;font-size:46px;line-height:1.05;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.phead p{margin:8px 0 0;font-size:26px;line-height:1.15;opacity:.95}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:28px 32px 32px;touch-action:pan-y;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{width:14px}
.pbody::-webkit-scrollbar-thumb{background:#c9c3bf;border-radius:8px}
.pbody::-webkit-scrollbar-track{background:transparent}
.anim{animation:in .26s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Auswahl-Chips */
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.chip{min-height:88px;min-width:120px;padding:0 26px;border-radius:44px;border:3px solid var(--line);background:#fff;font-size:29px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--grad);background-origin:border-box;border-color:transparent;color:#fff;font-weight:700}
.chip.day{flex:1;min-height:108px;border-radius:26px;flex-direction:column;gap:2px;padding:0 8px}
.chip.day b{font-size:32px;font-weight:700;text-transform:uppercase}
.chip.day span{font-size:24px;opacity:.85}
.chip.per{flex:1}

/* Zeilen */
.row{display:flex;gap:26px;padding:22px 18px;border-bottom:2px solid var(--line);border-radius:22px}
.row:last-child{border-bottom:0}
.row.now{background:#fff1e6;border-bottom-color:transparent}
.row.done{opacity:.45}
.tm{width:124px;flex:none}
.tm b{display:block;font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tm span{display:block;margin-top:8px;font-size:27px;color:var(--muted);font-variant-numeric:tabular-nums}
.info{min-width:0;flex:1}
.info h3{margin:0;font-size:35px;line-height:1.15;font-weight:700}
.info p{margin:8px 0 0;font-size:27px;line-height:1.3;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;font-size:23px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--grad);color:#fff;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:19px;font-size:23px;font-weight:500;border:2px solid var(--line);color:var(--muted);margin:10px 8px 0 0}
.tag.v{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:700}

/* Events / Termine */

function weekDates(){
  const n=midnight(new Date()), dow=n.getDay();
  const mon=new Date(n); mon.setDate(n.getDate()-((dow+6)%7)+((dow===0||dow===6)?7:0));
  return [0,1,2,3,4].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);return x});
}

function vPlan(){
  const days=weekDates(), now=new Date(), nm=now.getHours()*60+now.getMinutes();
  const isToday=sameDay(days[S.day],now); let nextDone=false;
  const chips=days.map((d,i)=>`<button class="chip day ${i===S.day?'on':''}" data-act="day" data-v="${i}"><b>${wdN()[i]}</b><span>${dm(d)}</span></button>`).join('');
  const rows=PLAN[S.day].map(l=>{
    let st='',pill='';
    if(isToday){
      if(nm>=mins(l.s)&&nm<mins(l.e)){st='now';pill=`<span class="pill">${t('Läuft jetzt')}</span>`}
      else if(nm>=mins(l.e)){st='done'}
      else if(!nextDone){nextDone=true;pill=`<span class="pill">${t('Als Nächstes')}</span>`}
    }
    return `<div class="row ${st}"><div class="tm"><b>${l.s}</b><span>${l.e}</span></div><div class="info">${pill}<h3>${esc(t(l.t))}</h3><p>${t(l.k)} · ${esc(t(l.w))}<br>${t('Raum')} ${esc(roomT(l.r))}</p></div></div>`;
  }).join('');
  return `<div class="chips">${chips}</div>${rows}`;
}

  return EVENTS.filter(e=>parse(e.d)>=today).map(e=>{
    const d=parse(e.d);
    return `<div class="row"><div class="badge"><b>${p2(d.getDate())}</b><span>${monN()[d.getMonth()]}</span></div><div class="info"><h3>${esc(t(e.t))}</h3><p>${e.time}${uhr()} · ${esc(t(e.o))}</p><span class="tag">${esc(t(e.g))}</span></div></div>`;
  }).join('');
}
function vTermine(){
  const today=midnight(new Date());
  return TERMINE.filter(x=>parse(x.e||x.d)>=today).map(x=>{
    const d=parse(x.d), diff=Math.round((d-today)/864e5);
    const range=x.e?`${dm(d)} – ${dmy(parse(x.e))}`:dmy(d);
    let w,cl='';
    if(diff<=0){w=t('Heute');cl='today'}
    else if(diff===1){w=t('Morgen');cl='hot'}
    else {w=LI?`in ${diff} days`:`in ${diff} Tagen`;if(diff<=14)cl='hot'}
    return `<div class="row"><div class="badge alt"><b>${p2(d.getDate())}</b><span>${monN()[d.getMonth()]}</span></div><div class="info"><h3>${esc(t(x.t))}</h3><p>${range}<br>${esc(t(x.n))}</p></div><div class="when ${cl}">${w}</div></div>`;
  }).join('');
}
function vMensa(){
  const days=weekDates();
  const chips=days.map((d,i)=>`<button class="chip day ${i===S.mday?'on':''}" data-act="mday" data-v="${i}"><b>${wdN()[i]}</b><span>${dm(d)}</span></button>`).join('');
  const dishes=MENSA[S.mday].map(x=>`<div class="dish"><div class="info"><div class="cat">${t(x.c)}</div><h3>${esc(t(x.t))}</h3>${x.g.map(tagHtml).join('')}</div><div class="price">${priceT(x.p)} €<small>${t('Studierende')}</small></div></div>`).join('');
  return `<div class="chips">${chips}</div>${dishes}`;
}
function vProfs(){
  const fs=['Alle','Informatik','Wirtschaft','Design','Technik'];
  const chips=fs.map(f=>`<button class="chip ${f===S.fak?'on':''}" data-act="fak" data-v="${f}">${t(f)}</button>`).join('');
  const list=PROFS.filter(p=>S.fak==='Alle'||p.f===S.fak).map(p=>`<div class="prof"><div class="av">${initials(p.n)}</div><div style="min-width:0"><h3>${esc(p.n)}</h3><div class="f"><b>${t(p.f)}</b> · ${t('Raum')} ${p.r}</div><p>${t('Sprechstunde')} ${hrs(p.h)}${uhr()}</p><p>${esc(p.m)}</p><p>${p.p}</p></div></div>`).join('');
  return `<div class="chips">${chips}</div>${list}`;
}
function vKaffee(){
  const P=KAFFEE.per[S.per];
  const rank=KAFFEE.names.map((n,i)=>({n,v:P.v[i]})).sort((a,b)=>b.v-a.v);
  const max=rank[0].v, sum=rank.reduce((a,b)=>a+b.v,0);
  const chips=KAFFEE.per.map((p,i)=>`<button class="chip per ${i===S.per?'on':''}" data-act="per" data-v="${i}">${t(p.k)}</button>`).join('');
  const pc=(r,i,cls)=>`<div class="pc ${cls}"><div class="av">${initials(r.n)}</div><div class="n">${r.n}</div><div class="c">${r.v} ${t('Tassen')}</div><div class="plinth">${i}</div></div>`;
  const podium=`<div class="podium">${pc(rank[1],2,'c2')}${pc(rank[0],1,'c1')}${pc(rank[2],3,'c3')}</div>`;
  const rest=rank.slice(3).map((r,i)=>`<div class="lrow"><div class="rk">${i+4}</div><div class="av">${initials(r.n)}</div><div class="nm">${r.n}</div><div class="bar"><i style="width:${Math.round(r.v/max*100)}%"></i></div><div class="ct">${r.v}</div></div>`).join('');
  return `<div class="chips">${chips}</div>${podium}${rest}<div class="total"><span>${t('Getrunkene Tassen in dieser Wertung')}</span><b>${sum}</b></div>`;
}

const TABS=[
  {id:'plan',   lb:'Stundenplan',       title:'Stundenplan',                 sub:'Informatik · 3. Semester',              ic:'plan',    v:vPlan},
  {id:'events', lb:'Events',            title:'Events',                      sub:'Das passiert demnächst auf dem Campus', ic:'events',  v:vEvents},
  {id:'termine',lb:'Wichtige Termine',  title:'Wichtige Termine',            sub:'Fristen und Semesterzeiten',            ic:'termine', v:vTermine},
  {id:'mensa',  lb:'Mensaplan',         title:'Mensaplan',                   sub:'Preise für Studierende',                ic:'mensa',   v:vMensa},
  {id:'profs',  lb:'Profs Kontakt',     title:'Profs Kontakt Informationen', sub:'Räume, Sprechzeiten, Erreichbarkeit',   ic:'profs',   v:vProfs},
  {id:'kaffee', lb:'Kaffee Leaderboard',title:'Kaffee Leaderboard',          sub:'Wer trinkt die meisten Tassen?',        ic:'kaffee',  v:vKaffee}
];

/* ===== Rendering ===== */
const nav=document.getElementById('nav'), panel=document.getElementById('panel');
function sync(){
  LI = S.lang==='en' ? 1 : 0;
  document.documentElement.lang = LI ? 'en' : 'de';
  document.getElementById('ftl').textContent = t('Tippen Sie auf ein Symbol, um Informationen anzuzeigen.');
  document.getElementById('ftr').textContent = t('Beispieldaten');
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.lang));
  tick();
}
function drawNav(){
  nav.innerHTML=TABS.map(x=>`<button class="tab" role="tab" aria-selected="${x.id===S.tab}" data-act="tab" data-v="${x.id}">${ICON[x.ic]}<span class="lb">${t(x.lb)}</span>${ARROW}</button>`).join('');
}
function drawPanel(animate){
  const x=TABS.find(y=>y.id===S.tab);
  panel.innerHTML=`<div class="phead">${ICON[x.ic]}<div><h1>${t(x.title)}</h1><p>${t(x.sub)}</p></div></div><div class="pbody ${animate?'anim':''}" role="tabpanel">${x.v()}</div>`;
}
function drawAll(animate){sync();drawNav();drawPanel(animate)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='lang'){ if(S.lang===v) return; S.lang=v; drawAll(false); return; }
  if(a==='tab'){ if(S.tab===v) return; S.tab=v; drawAll(true); return; }
  if(a==='day')  S.day=+v;
  if(a==='mday') S.mday=+v;
  if(a==='fak')  S.fak=v;
  if(a==='per')  S.per=+v;
  drawPanel(true);
});
document.addEventListener('contextmenu',e=>e.preventDefault());

/* Uhr */
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=p2(n.getHours())+':'+p2(n.getMinutes());
  document.getElementById('dat').textContent=n.toLocaleDateString(LI?'en-GB':'de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,1000);
setInterval(()=>{ if(S.tab==='plan'){const y=document.querySelector('.pbody'),s=y?y.scrollTop:0;drawPanel(false);const z=document.querySelector('.pbody');if(z)z.scrollTop=s;} },60000);

/* Skalierung auf die Fenstergröße (auf dem 1080x1920-Display 1:1) */
const vp=document.getElementById('vp'), st=document.getElementById('stage');
function fit(){
  const w=vp.clientWidth,h=vp.clientHeight,s=Math.min(w/1080,h/1920);
  st.style.transform=`translate(${(w-1080*s)/2}px,${(h-1920*s)/2}px) scale(${s})`;
}
addEventListener('resize',fit); fit();

/* Logo: logo.svg oder logo.png neben dieser Datei; sonst bleibt der Schriftzug */
(function(){
  const img=document.getElementById('logo'), wm=document.getElementById('wm'), c=['logo.svg','logo.png']; let i=0;
  const next=()=>{ if(i<c.length) img.src=c[i++]; };
  img.onerror=next;
  img.onload=()=>{ img.hidden=false; wm.hidden=true; };
  next();
})();

/* Kiosk: nach 2 Minuten ohne Berührung zurück zum Start (und zur deutschen Sprache) */
let idle;
function bump(){clearTimeout(idle);idle=setTimeout(()=>{S=fresh();drawAll(true)},120000)}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,bump,{passive:true}));
bump();

drawAll(false);
</script>
